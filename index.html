<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EB OFFICE | Business & Digital Solutions</title>
    <!-- مكتبة Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #d4af37;
            --dark-bg: #111;
            --light-bg: #f9f9f9;
            --text-color: #333;
        }
        body { font-family: Tahoma, sans-serif; background-color: var(--light-bg); margin: 0; padding: 0; color: var(--text-color); text-align: right; direction: rtl; }
        header { background-color: var(--dark-bg); color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary-color); }
        .logo { font-size: 20px; font-weight: bold; color: var(--primary-color); }
        .container { max-width: 800px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: var(--primary-color); border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .service-box, .review-form-box { margin-bottom: 30px; }
        input, textarea, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background-color: var(--primary-color); color: #fff; border: none; padding: 14px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #bfa130; }
        #form-status { margin-top: 12px; font-weight: bold; text-align: center; }
        .reviews-list { margin-top: 20px; }
        .review-card { background: #fdfdfd; border: 1px solid #eee; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .review-card h4 { margin: 0 0 5px 0; color: #444; }
        .review-card span { font-size: 12px; color: #777; }
    </style>
</head>
<body>

    <header>
        <div class="logo">EB OFFICE</div>
        <div>حلول أعمالك الرقمية باحترافية</div>
    </header>

    <div class="container">
        <!-- قسم طلبات الخدمات (واتساب المباشر السريع) -->
        <div class="service-box">
            <h2>طلب خدمة أو استشارة</h2>
            <form id="serviceOrderForm" onsubmit="sendWhatsAppOrder(event)">
                <input type="tel" id="whatsappPhone" placeholder="رقم الهاتف / واتساب" required>
                <select id="serviceType" required>
                    <option value="">اختر الخدمة المطلوبة</option>
                    <option value="تصميم وبرمجة مواقع">تصميم وبرمجة مواقع</option>
                    <option value="حلول رقمية ومحاسبية">حلول رقمية ومحاسبية</option>
                    <option value="استشارة أعمال">استشارة أعمال</option>
                </select>
                <textarea id="projectDetails" rows="3" placeholder="توضيح طبيعة المشروع وأهم المتطلبات..." required></textarea>
                <button type="submit">إرسال الطلب مباشـرة عبر واتساب</button>
            </form>
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 40px 0;">

        <!-- قسم التقييمات الآمن (عبر Supabase) -->
        <div class="review-form-box">
            <h2>أضف تقييمك ورأيك في الخدمة</h2>
            <form id="reviewForm">
                <input type="text" id="reviewerName" placeholder="اسمك الكريم" required>
                <input type="text" id="reviewerRole" placeholder="صفتك أو مجالك (مثلاً: محاسب عام)" required>
                <textarea id="reviewText" rows="4" placeholder="رأيك وتجربتك في الشغل معنا" required></textarea>
                <button type="submit" id="submitBtn">إرسال التقييم للمراجعة</button>
                <div id="form-status"></div>
            </form>
        </div>

        <!-- عرض التقييمات المعتمدة -->
        <div class="reviews-list">
            <h2>آراء العملاء</h2>
            <div id="reviewsContainer">جاري تحميل الآراء...</div>
        </div>
    </div>

    <script>
        // إعدادات اتصال Supabase
        const SUPABASE_URL = 'https://mvmwhrgaeftjxazwfklg.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_8R0LqM7AbuPZiGJCyx0hwA_Bi0Xe5eH';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // إرسال طلب الخدمة عبر واتساب
        function sendWhatsAppOrder(e) {
            e.preventDefault();
            const phone = document.getElementById('whatsappPhone').value;
            const service = document.getElementById('serviceType').value;
            const details = document.getElementById('projectDetails').value;
            
            const message = `مرحباً EB OFFICE، أود طلب خدمة:\n*الخدمة:* ${service}\n*رقم التواصل:* ${phone}\n*التفاصيل:* ${details}`;
            const encodedMessage = encodeURIComponent(message);
            // استبدل الرقم برقم الواتساب الخاص بك
            window.open(`https://wa.me/201000000000?text=${encodedMessage}`, '_blank');
        }

        // التعامل مع إرسال التقييم وسلاسة الزرار
        const reviewForm = document.getElementById('reviewForm');
        const submitBtn = document.getElementById('submitBtn');
        const formStatus = document.getElementById('form-status');

        reviewForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري الإرسال...';
            formStatus.textContent = '';

            const name = document.getElementById('reviewerName').value.trim();
            const role = document.getElementById('reviewerRole').value.trim();
            const text = document.getElementById('reviewText').value.trim();

            try {
                const { error } = await _supabase
                    .from('reviews')
                    .insert([{ name: name, role: role, text: text, approved: false }]);

                if (error) throw error;

                formStatus.style.color = 'green';
                formStatus.textContent = 'تم إرسال تقييمك بنجاح، في انتظار مراجعة الإدارة ونشره.';
                reviewForm.reset();
            } catch (err) {
                console.error(err);
                formStatus.style.color = 'red';
                formStatus.textContent = 'حدث خطأ أثناء الإرسال، تأكد من الاتصال ومحاولة مجدداً.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'إرسال التقييم للمراجعة';
            }
        });

        // جلب وعرض التقييمات المعتمدة فقط
        async function fetchApprovedReviews() {
            const container = document.getElementById('reviewsContainer');
            try {
                const { data, error } = await _supabase
                    .from('reviews')
                    .select('*')
                    .eq('approved', true)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<p style="color: #777;">لا توجد تقييمات منشورة حتى الآن. كن أول من يقييم!</p>';
                    return;
                }

                container.innerHTML = '';
                data.forEach(rev => {
                    const card = document.createElement('div');
                    card.className = 'review-card';
                    card.innerHTML = `
                        <h4>${rev.name} <span>(${rev.role})</span></h4>
                        <p>${rev.text}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p style="color: red;">تعذر تحميل الآراء حالياً.</p>';
            }
        }

        // تشغيل دالة جلب الآراء عند فتح الموقع
        fetchApprovedReviews();
    </script>
</body>
</html>
